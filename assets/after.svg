<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title description">
  <title id="title">개선 후 분석 흐름</title>
  <desc id="description">업로드 입력과 작업 상태를 저장하고 작업 ID를 돌려준다. 별도 실행기가 학습 구성을 확정한 뒤 완성된 주제를 검증·저장해 첫 주제부터 제공한다. 재접속하거나 서버가 재시작해도 저장된 작업을 조회하고 복구한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#47657C"/></marker>
  </defs>
  <rect width="1000" height="430" rx="18" fill="#FFFFFF"/>
  <text x="26" y="37" fill="#47657C" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700">요청 접수와 상태 조회</text>
  <text x="235" y="237" fill="#47657C" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700">독립적으로 진행되는 분석</text>

  <path d="M 190 105 H 225" fill="none" stroke="#47657C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 480 105 H 515" fill="none" stroke="#47657C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 705 105 H 740" fill="none" stroke="#47657C" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="20" y="65" width="170" height="84" rx="14" fill="#F0F6FA" stroke="#ADC9DA" stroke-width="2"/>
  <text x="105" y="113" text-anchor="middle" fill="#163C52" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700">자료 업로드</text>

  <rect x="235" y="65" width="245" height="84" rx="14" fill="#F0F6FA" stroke="#ADC9DA" stroke-width="2"/>
  <text x="357.5" y="99" text-anchor="middle" fill="#163C52" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700">입력·작업 상태 저장</text>
  <text x="357.5" y="127" text-anchor="middle" fill="#47657C" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17">브라우저 연결과 분리</text>

  <rect x="525" y="65" width="180" height="84" rx="14" fill="#F0F6FA" stroke="#ADC9DA" stroke-width="2"/>
  <text x="615" y="113" text-anchor="middle" fill="#163C52" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700">작업 ID 반환</text>

  <rect x="750" y="65" width="230" height="84" rx="14" fill="#F0F6FA" stroke="#ADC9DA" stroke-width="2"/>
  <text x="865" y="99" text-anchor="middle" fill="#163C52" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700">재접속 후 상태 조회</text>
  <text x="865" y="127" text-anchor="middle" fill="#47657C" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17">같은 작업 ID 사용</text>

  <path d="M 357.5 149 V 193 H 105 V 264" fill="none" stroke="#47657C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 190 306 H 225" fill="none" stroke="#47657C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 480 306 H 515" fill="none" stroke="#47657C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 705 306 H 740" fill="none" stroke="#47657C" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="20" y="265" width="170" height="84" rx="14" fill="#F0F6FA" stroke="#ADC9DA" stroke-width="2"/>
  <text x="105" y="313" text-anchor="middle" fill="#163C52" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700">분석 실행기</text>

  <rect x="235" y="265" width="245" height="84" rx="14" fill="#F0F6FA" stroke="#ADC9DA" stroke-width="2"/>
  <text x="357.5" y="299" text-anchor="middle" fill="#163C52" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700">학습 구성 확정</text>
  <text x="357.5" y="327" text-anchor="middle" fill="#47657C" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17">주제별 원문 범위 고정</text>

  <rect x="525" y="265" width="180" height="84" rx="14" fill="#F0F6FA" stroke="#ADC9DA" stroke-width="2"/>
  <text x="615" y="299" text-anchor="middle" fill="#163C52" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700">완성 주제 검증</text>
  <text x="615" y="327" text-anchor="middle" fill="#47657C" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17">저장 후 공개</text>

  <rect x="750" y="265" width="230" height="84" rx="14" fill="#E8F5EE" stroke="#90C8A3" stroke-width="2"/>
  <text x="865" y="313" text-anchor="middle" fill="#135C33" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="700">첫 주제부터 학습</text>

  <rect x="20" y="375" width="960" height="38" rx="10" fill="#F6F9FB"/>
  <text x="500" y="400" text-anchor="middle" fill="#47657C" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17">저장된 작업을 기준으로 새로고침·재접속·서버 재시작 후에도 이어서 확인</text>
</svg>
